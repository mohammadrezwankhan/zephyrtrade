[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrtrade"
version = "1.1.0"
description = "ML-driven day-ahead and balancing-market optimization for wind energy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ZephyrTrade contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "defusedxml==0.7.1",
  "playwright==1.64.1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
zephyr-app = "zephyrtrade.app:main"
zephyr-data = "zephyrtrade.data_loader:main"
zephyr-phase2 = "zephyrtrade.phase2:main"
zephyr-phase3 = "zephyrtrade.phase3:main"
zephyr-preprocess = "zephyrtrade.preprocessing:main"
zephyr-run = "zephyrtrade.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zephyrtrade = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RET", "ARG", "PTH", "PERF", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions are test contracts; S101 remains enabled in production.
"tests/*" = ["D", "S101"]
"scripts/test_*.py" = ["S101"]

[dependency-groups]
dev = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.140.3",
  "pandas-stubs==3.1.0.261029",
  "scipy-stubs==1.18.1.1",
  "scikit-learn-stubs==0.0.3",
  "joblib-stubs==1.6.0.1.20261012",
  "types-defusedxml==0.7.0.20260504",
  "playwright==1.64.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = true
files = ["src", "tests", "scripts", ".github/security"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
