name: Verify Cloudflare browser export
on:
  push:
    branches: [main, astra/cloudflare-browser-apps]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/build-cloudflare.mjs
      - run: node scripts/check-cloudflare.mjs
      - run: node scripts/build-domain.mjs
      - run: node scripts/check-domain.mjs
