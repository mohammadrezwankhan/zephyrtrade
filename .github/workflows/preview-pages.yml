name: Publish learning dashboard (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the learning dashboard before publishing
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          docs = Path('docs')
          page = (docs / 'index.html').read_text(encoding='utf-8')
          config = json.loads((docs / 'lesson-config.json').read_text(encoding='utf-8'))
          assert 'data-flagship-repo="' + os.environ['EXPECTED_REPOSITORY'] + '"' in page
          assert 'data-flagship-version="1.0"' in page
          assert 'data-flagship-build="' in page
          assert len(config['modules']) == 4
          assert config['repository']['owner'] + '/' + config['repository']['slug'] == os.environ['EXPECTED_REPOSITORY']
          for item in docs.rglob('*'):
              assert not item.is_symlink(), 'Pages artifact cannot contain symlinks: ' + str(item)
          print('Dashboard identity and four lesson modules verified before upload.')
          PY

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage the same learning dashboard as the automatic publisher
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy static demonstration
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
