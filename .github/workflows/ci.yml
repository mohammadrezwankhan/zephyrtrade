name: ci

on:
  push:
    branches: [main, astra/championization]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Test with warnings as errors
        run: python -m pytest -W error

      - name: Set up Node for browser numerical tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Browser numerical and Python parity checks
        run: |
          node --test tests/browser/engine.test.cjs
          python scripts/verify_engines.py

      - name: Build source and wheel distributions
        run: python -m build

  pinned-reproducibility:
    name: Pinned Linux / Python 3.13.5 reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - name: Install the pinned scientific environment with project metadata
        run: |
          python -m pip install -r requirements-tested.txt -e ".[dev]"
          python -m pip check
          python --version
          python -m pip freeze
      - name: Validate the actual pinned environment
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pytest -W error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Scientific parity, distributions and isolated research smoke
        run: |
          node --test tests/browser/engine.test.cjs
          python scripts/verify_engines.py
          python -m build
          python scripts/smoke_research.py --output "$RUNNER_TEMP/zephyrtrade-research-smoke"
