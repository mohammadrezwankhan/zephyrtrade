# Version updates wait seven days; GitHub exempts security updates from cooldown.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  groups:
    codeql-actions:
      patterns:
      - 'github/codeql-action/*'
- package-ecosystem: pip
  directory: /.github/security
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # OpenGrep 1.33.1 runtime bounds; revisit when scanner bounds change.
  # Update-type filters keep security updates eligible.
  # Source: https://github.com/dependabot/dependabot-core/blob/05146d8f2a50ea4adf6e00a197c85afae99f7051/common/lib/dependabot/config/ignore_condition.rb
  ignore:
  - dependency-name: boltons
    update-types:
    - version-update:semver-major
  - dependency-name: glom
    update-types:
    - version-update:semver-major
  - dependency-name: peewee
    update-types:
    - version-update:semver-major
  - dependency-name: rich
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: wcmatch
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /tests/browser/audit
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  # Keep routine tooling updates compatible with Node >=22 and TypeScript 5.9.
  # Update-type filters keep security updates eligible.
  ignore:
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  - dependency-name: "@eslint/js"
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: typescript-eslint
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  groups:
    development-tooling:
      dependency-type: development
      patterns:
      - '*'
      update-types:
      - minor
      - patch
